; Home data collector configuration. Copy to config.ini (git-ignored - it holds
; credentials). In Docker it lives on the appdata volume mounted at /data.

[GENERAL]
; Tokens, logs and the heartbeat go here when run outside Docker (git-ignored).
; The Docker image always uses the /data volume instead.
DataDir = .dev/data

[DATABASE]
; Owner role of the `home` database - the collector applies the schema migrations.
Url = postgresql://home:CHANGE_ME@192.168.178.70:5432/home

[STORAGE]
; Raw samples older than this are deleted; the 1-minute rollups are kept forever.
; 0 = keep raw samples forever (roughly 1-2 GB per year at the default intervals).
RawRetentionDays = 0

[ENVOY]
; Enphase IQ Gateway on the LAN - same values as Wallbox-Steuerung's [ENPHASE].
Url = https://192.168.178.XX
Serial = 12XXXXXXXXXX
; Enlighten account, used once a year to fetch the local-access token ...
Username = you@example.com
Password = CHANGE_ME
; ... or paste a token instead and leave Username/Password empty, e.g. the one
; in Wallbox-Steuerung's envoy_token.json.
Token =
PollSeconds = 10
MaxAgeSeconds = 60

[EASEE]
; Read-only: this never sends commands to the charger.
Username = +49XXXXXXXXXX
Password = CHANGE_ME
; Optional - defaults to the first charger of the account.
ChargerId =
PollSecondsActive = 30
PollSecondsIdle = 120

[LOGGING]
Level = INFO
LogDays = 7

[NOTIFICATIONS]
; Optional Signal alerts via the existing Signal-API container (see
; Wallbox-Steuerung README). Absent or disabled = silent no-op.
Enabled = false
ApiUrl = http://192.168.178.70:8080
Sender = +49XXXXXXXXXX
Recipients = +49XXXXXXXXXX
; Alert when a source or the database has been failing this long.
AlertAfterMinutes = 15
CooldownMinutes = 60
TimeoutSeconds = 10
